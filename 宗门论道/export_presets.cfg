
; 《宗门论道》导出预设配置
; 包含: 微信小游戏 / Steam桌面 / 安卓 三套导出预设
; 对应: I2.02 微信导出配置 / I3.04 Steam导出配置 / I4.01 Android导出配置
; 使用: Godot编辑器 → Project → Export → 选择预设 → Export Project

[preset.0]

name="MiniGame (微信小游戏)"
platform="Web"
runnable=true
dedicated_server=false
custom_features=PackedStringArray("wechat")
export_filter="all_resources"
include_filter="*.gd, *.tscn, *.tres, *.json"
exclude_filter="addons/godotsteam/*, addons/google_play_billing/*"
export_path="../export/wechat/index.html"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
vram_texture_compression/for_desktop=false
vram_texture_compression/for_mobile=true
html/export_icon=true
html/custom_html_shell=""
html/head_include=""
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
; 微信小游戏特定: 通过wx.* API桥接
custom_features/wechat=true

[preset.1]

name="Steam (Windows桌面)"
platform="Windows Desktop"
runnable=true
dedicated_server=false
custom_features=PackedStringArray("steam")
export_filter="all_resources"
include_filter="*.gd, *.tscn, *.tres, *.json"
exclude_filter="addons/godot_mini_game/*, addons/google_play_billing/*"
export_path="../export/steam/宗门论道.exe"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.1.options]

custom_template/debug=""
custom_template/release=""
debug/export_native_script=true
binary_format/embed_pck=true
texture_format/bptc=false
texture_format/s3tc=true
binary_format/architecture="x86_64"
codesign/enable=false
application/icon="res://icon.svg"
application/file_version="1.0.0.0"
application/product_version="1.0.0.0"
application/company_name="宗门论道工作室"
application/product_name="宗门论道"
application/file_description="修仙宗门大战 - 实时策略卡牌"
application/copyright=""
; Steam特定: 启用Steam运行时特性
custom_features/steam=true
; GodotSteam插件会在导出时注入steam_api64.dll

[preset.2]

name="Android (Google Play)"
platform="Android"
runnable=true
dedicated_server=false
custom_features=PackedStringArray("android")
export_filter="all_resources"
include_filter="*.gd, *.tscn, *.tres, *.json"
exclude_filter="addons/godot_mini_game/*, addons/godotsteam/*"
export_path="../export/android/宗门论道.aab"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.2.options]

custom_template/debug=""
custom_template/release=""
gradle_build/use_gradle_build=true
gradle_build/export_format=1
; 1 = AAB (Google Play上架格式)
architectures/armeabi-v7a=true
architectures/arm64-v8a=true
architectures/x86_64=false
keystore/debug=""
keystore/debug_user=""
keystore/debug_password=""
keystore/release=""
keystore/release_user=""
keystore/release_password=""
one_click_deploy/clear_previous_install=true
; 包名: 反向域名格式
package/unique_name="com.zongmenlundao.game"
package/name="宗门论道"
package/signed=true
; 图标和启动屏
package/app_icon="res://icon.svg"
package/launch_screens=""
; 屏幕方向: 竖屏游戏
package/orientation=0
; 0 = Portrait (竖屏)
package/immediate_activity=false
; 权限: 网络(支付/云存档) + 振动(反馈)
package/custom_permissions=PackedStringArray("INTERNET", "VIBRATE", "BILLING")
; 启用Google Play Billing
custom_features/android_billing=true
